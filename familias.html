<tr class="fila-filtros">
    <th>
        <input
            type="text"
            id="filtroSitioTabla"
            class="filtro-tabla"
            placeholder="Sitio"
            autocomplete="off"
        >
    </th>

    <th>
        <input
            type="text"
            id="filtroFamiliaTabla"
            class="filtro-tabla"
            placeholder="FamiliaId"
            autocomplete="off"
        >
    </th>

    <th>
        <input
            type="text"
            id="filtroPersonaTabla"
            class="filtro-tabla"
            placeholder="PersonaId"
            autocomplete="off"
        >
    </th>

    <th>
        <input
            type="text"
            id="filtroNombresTabla"
            class="filtro-tabla"
            placeholder="Nombres"
            autocomplete="off"
        >
    </th>

    <th>
        <input
            type="text"
            id="filtroApellidosTabla"
            class="filtro-tabla"
            placeholder="Apellidos"
            autocomplete="off"
        >
    </th>

    <th>
        <select
            id="filtroEstadoTabla"
            class="filtro-tabla filtro-estado"
        >
            <option value="">Todos</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>
    </th>
</tr>
