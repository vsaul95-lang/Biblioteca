<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Devoluciones - Biblioteca</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f4f6f8;

            color:
                #333;

        }


        .encabezado {

            background:
                #263238;

            color:
                white;

            padding:
                18px 25px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

        }


        .encabezado h1 {

            margin:
                0;

            font-size:
                22px;

        }


        .btn-volver {

            background:
                #546e7a;

            color:
                white;

            text-decoration:
                none;

            padding:
                9px 14px;

            border-radius:
                6px;

            font-size:
                14px;

        }


        .contenedor {

            max-width:
                1200px;

            margin:
                20px auto;

            padding:
                0 15px;

        }


        .resumen {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                12px;

            margin-bottom:
                18px;

        }


        .tarjeta {

            background:
                white;

            border-radius:
                8px;

            padding:
                15px;

            text-align:
                center;

            box-shadow:
                0 2px 6px rgba(0,0,0,.08);

        }


        .tarjeta .numero {

            font-size:
                25px;

            font-weight:
                bold;

            margin-bottom:
                4px;

        }


        .tarjeta .texto {

            font-size:
                13px;

            color:
                #666;

        }


        .seccion {

            background:
                white;

            border-radius:
                8px;

            padding:
                18px;

            margin-bottom:
                18px;

            box-shadow:
                0 2px 6px rgba(0,0,0,.08);

        }


        .seccion h2 {

            margin:
                0 0 15px;

            font-size:
                18px;

        }


        .fila-busqueda {

            display:
                flex;

            gap:
                10px;

            align-items:
                center;

        }


        input,
        select {

            flex:
                1;

            padding:
                10px 12px;

            border:
                1px solid #ccc;

            border-radius:
                5px;

            font-size:
                14px;

            background:
                white;

        }


        button {

            border:
                none;

            border-radius:
                5px;

            padding:
                10px 15px;

            cursor:
                pointer;

            font-size:
                14px;

        }


        .btn-buscar {

            background:
                #1976d2;

            color:
                white;

        }


        .btn-devolver {

            background:
                #2e7d32;

            color:
                white;

            padding:
                7px 11px;

            font-size:
                12px;

        }


        .mensaje {

            margin-top:
                12px;

            padding:
                10px;

            border-radius:
                5px;

            display:
                none;

        }


        .mensaje.exito {

            display:
                block;

            background:
                #e8f5e9;

            color:
                #2e7d32;

        }


        .mensaje.error {

            display:
                block;

            background:
                #ffebee;

            color:
                #c62828;

        }


        .tabla-contenedor {

            overflow-x:
                auto;

            margin-top:
                15px;

        }


        table {

            width:
                100%;

            min-width:
                900px;

            border-collapse:
                collapse;

            font-size:
                13px;

        }


        th {

            background:
                #eceff1;

            padding:
                9px;

            border-bottom:
                1px solid #ccc;

            text-align:
                center;

            white-space:
                nowrap;

        }


        td {

            padding:
                9px;

            border-bottom:
                1px solid #eee;

            text-align:
                center;

            white-space:
                nowrap;

        }


        td.nombre {

            text-align:
                left;

        }


        td.libro {

            text-align:
                left;

            min-width:
                190px;

        }


        td.comentarios {

            min-width:
                110px;

        }


        tr.vencido {

            background:
                #fff3f3;

        }


        .estado-prestado {

            color:
                #1565c0;

            font-weight:
                bold;

        }


        .estado-vencido {

            color:
                #c62828;

            font-weight:
                bold;

        }


        .estado-devuelto {

            color:
                #2e7d32;

            font-weight:
                bold;

        }


        .detalle {

            background:
                #f7f9fa;

            border-radius:
                6px;

            padding:
                14px;

            margin-top:
                15px;

            display:
                none;

        }


        .detalle p {

            margin:
                6px 0;

            font-size:
                14px;

        }


        .campo-comentario {

            margin-top:
                12px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                5px;

        }


        .campo-comentario label {

            font-size:
                13px;

            font-weight:
                bold;

            color:
                #455a64;

        }


        .campo-comentario select {

            max-width:
                280px;

            padding:
                8px 10px;

            font-size:
                13px;

        }


        .aviso-extraviado {

            display:
                none;

            margin-top:
                8px;

            padding:
                9px 10px;

            background:
                #fff3e0;

            border:
                1px solid #ffcc80;

            border-radius:
                5px;

            color:
                #e65100;

            font-size:
                12px;

        }


        .confirmacion {

            background:
                #fff8e1;

            border:
                1px solid #ffe082;

            border-radius:
                6px;

            padding:
                15px;

            margin-top:
                15px;

            display:
                none;

        }


        .confirmacion strong {

            color:
                #e65100;

        }


        .acciones-confirmacion {

            margin-top:
                12px;

            display:
                flex;

            gap:
                8px;

        }


        .btn-confirmar {

            background:
                #2e7d32;

            color:
                white;

        }


        .btn-cancelar {

            background:
                #757575;

            color:
                white;

        }


        @media (max-width: 700px) {

            .resumen {

                grid-template-columns:
                    1fr;

            }


            .fila-busqueda {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .encabezado {

                gap:
                    10px;

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }


            .campo-comentario select {

                max-width:
                    100%;

            }

        }

    </style>

</head>


<body>


<header class="encabezado">

    <h1>
        📚 Devoluciones
    </h1>


    <a
        href="index.html"
        class="btn-volver"
    >
        ← Volver
    </a>

</header>


<div class="contenedor">


    <!-- =====================================================
         RESUMEN
    ====================================================== -->

    <section class="resumen">


        <div class="tarjeta">

            <div
                class="numero"
                id="totalActivos"
            >
                0
            </div>

            <div class="texto">
                Préstamos activos
            </div>

        </div>


        <div class="tarjeta">

            <div
                class="numero"
                id="totalVencidos"
            >
                0
            </div>

            <div class="texto">
                Vencidos
            </div>

        </div>


        <div class="tarjeta">

            <div
                class="numero"
                id="totalDisponibles"
            >
                0
            </div>

            <div class="texto">
                Libros disponibles
            </div>

        </div>


    </section>


    <!-- =====================================================
         BUSCAR
    ====================================================== -->

    <section class="seccion">


        <h2>
            Buscar préstamo
        </h2>


        <div class="fila-busqueda">


            <input
                type="text"
                id="buscar"
                placeholder="Familia, PersonaId, nombre, apellido o código de libro..."
            >


            <button
                class="btn-buscar"
                id="btnBuscar"
            >
                Buscar
            </button>


        </div>


        <div
            id="mensaje"
            class="mensaje"
        ></div>


        <div class="tabla-contenedor">


            <table>


                <thead>

                    <tr>

                        <th>
                            FamiliaId
                        </th>

                        <th>
                            PersonaId
                        </th>

                        <th>
                            Libro
                        </th>

                        <th>
                            Préstamo
                        </th>

                        <th>
                            Devolución
                        </th>

                        <th>
                            Estado
                        </th>

                        <th>
                            Comentarios
                        </th>

                        <th>
                            Acciones
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="tablaPrestamos"
                ></tbody>


            </table>


        </div>


    </section>


    <!-- =====================================================
         DETALLE
    ====================================================== -->

    <section class="seccion">


        <h2>
            Detalle de devolución
        </h2>


        <div
            id="detalle"
            class="detalle"
        ></div>


        <div
            id="confirmacion"
            class="confirmacion"
        >


            <strong>
                ¿Desea registrar la devolución de este libro?
            </strong>


            <div
                class="acciones-confirmacion"
            >


                <button
                    class="btn-confirmar"
                    id="btnConfirmar"
                >
                    Sí, registrar devolución
                </button>


                <button
                    class="btn-cancelar"
                    id="btnCancelar"
                >
                    Cancelar
                </button>


            </div>


        </div>


    </section>


</div>


<script>


/* =========================================================
   VARIABLES
========================================================= */

let prestamos = [];

let prestamoSeleccionado = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const tablaPrestamos =
    document.getElementById(
        "tablaPrestamos"
    );


const buscarInput =
    document.getElementById(
        "buscar"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


const detalle =
    document.getElementById(
        "detalle"
    );


const confirmacion =
    document.getElementById(
        "confirmacion"
    );


/* =========================================================
   INICIO
========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    cargarDatos

);


/* =========================================================
   CARGAR DATOS
========================================================= */

async function cargarDatos() {

    try {


        const {
            data,
            error
        } = await supabaseClient

            .from("prestamos")

            .select("*")

            .eq(
                "estado",
                "Prestado"
            )

            .order(
                "fechaPrestamo",
                {
                    ascending:
                        false
                }
            );


        if (error) {

            throw error;

        }


        prestamos =
            data || [];


        actualizarResumen();


        mostrarPrestamos(
            prestamos
        );


    } catch (error) {


        console.error(error);


        mostrarMensaje(

            "No fue posible cargar los préstamos.",

            "error"

        );

    }

}


/* =========================================================
   RESUMEN
========================================================= */

async function actualizarResumen() {


    const totalActivos =
        prestamos.length;


    const hoy =
        obtenerHoy();


    const totalVencidos =
        prestamos.filter(

            prestamo => {

                const fecha =
                    obtenerFechaSoloDia(
                        prestamo.fechaDevolucion
                    );

                return (
                    fecha &&
                    fecha < hoy
                );

            }

        ).length;


    document.getElementById(
        "totalActivos"
    ).textContent =
        totalActivos;


    document.getElementById(
        "totalVencidos"
    ).textContent =
        totalVencidos;


    try {


        const {
            data,
            error
        } = await supabaseClient

            .from("libros")

            .select(
                "id, estado"
            );


        if (error) {

            throw error;

        }


        const disponibles =
            (data || []).filter(

                libro =>
                    libro.estado ===
                    "Disponible"

            ).length;


        document.getElementById(
            "totalDisponibles"
        ).textContent =
            disponibles;


    } catch (error) {


        console.error(error);


        document.getElementById(
            "totalDisponibles"
        ).textContent =
            "—";

    }

}


/* =========================================================
   MOSTRAR PRÉSTAMOS
========================================================= */

function mostrarPrestamos(
    lista
) {


    tablaPrestamos.innerHTML =
        "";


    if (!lista.length) {


        tablaPrestamos.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="padding:20px;"
                >
                    No hay préstamos activos.
                </td>

            </tr>

        `;


        return;

    }


    const hoy =
        obtenerHoy();


    lista.forEach(

        prestamo => {


            const fechaDevolucion =
                obtenerFechaSoloDia(
                    prestamo.fechaDevolucion
                );


            const vencido =
                fechaDevolucion &&
                fechaDevolucion < hoy;


            const fila =
                document.createElement(
                    "tr"
                );


            if (vencido) {

                fila.classList.add(
                    "vencido"
                );

            }


            /* FamiliaId */

            const tdFamilia =
                document.createElement(
                    "td"
                );


            tdFamilia.textContent =
                prestamo.FamiliaId ||
                "—";


            /* PersonaId */

            const tdPersona =
                document.createElement(
                    "td"
                );


            tdPersona.textContent =
                prestamo.PersonaId ||
                "—";


            /* Libro */

            const tdLibro =
                document.createElement(
                    "td"
                );


            tdLibro.className =
                "libro";


            const codigo =
                formatearCodigo(
                    prestamo.codigoLibro
                );


            tdLibro.textContent =
                `${codigo} - ${
                    prestamo.nombreLibro ||
                    "Sin nombre"
                }`;


            /* Préstamo */

            const tdPrestamo =
                document.createElement(
                    "td"
                );


            tdPrestamo.textContent =
                formatearFecha(
                    prestamo.fechaPrestamo
                );


            /* Devolución */

            const tdDevolucion =
                document.createElement(
                    "td"
                );


            tdDevolucion.textContent =
                formatearFecha(
                    prestamo.fechaDevolucion
                );


            /* Estado */

            const tdEstado =
                document.createElement(
                    "td"
                );


            if (vencido) {


                tdEstado.textContent =
                    "Vencido";


                tdEstado.className =
                    "estado-vencido";


            } else {


                tdEstado.textContent =
                    "Prestado";


                tdEstado.className =
                    "estado-prestado";

            }


            /* Comentarios */

            const tdComentarios =
                document.createElement(
                    "td"
                );


            tdComentarios.className =
                "comentarios";


            const comentario =
                String(
                    prestamo.comentarios ||
                    ""
                ).trim();


            tdComentarios.textContent =
                comentario ||
                "—";


            /* Acciones */

            const tdAccion =
                document.createElement(
                    "td"
                );


            const boton =
                document.createElement(
                    "button"
                );


            boton.type =
                "button";


            boton.className =
                "btn-devolver";


            boton.textContent =
                "Devolver";


            boton.addEventListener(

                "click",

                function() {

                    seleccionarPrestamo(
                        prestamo
                    );

                }

            );


            tdAccion.appendChild(
                boton
            );


            fila.appendChild(
                tdFamilia
            );


            fila.appendChild(
                tdPersona
            );


            fila.appendChild(
                tdLibro
            );


            fila.appendChild(
                tdPrestamo
            );


            fila.appendChild(
                tdDevolucion
            );


            fila.appendChild(
                tdEstado
            );


            fila.appendChild(
                tdComentarios
            );


            fila.appendChild(
                tdAccion
            );


            tablaPrestamos.appendChild(
                fila
            );


        }

    );

}


/* =========================================================
   SELECCIONAR PRÉSTAMO
========================================================= */

function seleccionarPrestamo(
    prestamo
) {


    prestamoSeleccionado =
        prestamo;


    detalle.innerHTML = `

        <p>

            <strong>
                FamiliaId:
            </strong>

            ${escapeHtml(
                prestamo.FamiliaId ||
                "—"
            )}

        </p>


        <p>

            <strong>
                PersonaId:
            </strong>

            ${escapeHtml(
                prestamo.PersonaId ||
                "—"
            )}

        </p>


        <p>

            <strong>
                Persona:
            </strong>

            ${escapeHtml(
                prestamo.Nombres ||
                ""
            )}

            ${escapeHtml(
                prestamo.Apellidos ||
                ""
            )}

        </p>


        <p>

            <strong>
                Libro:
            </strong>

            ${escapeHtml(
                prestamo.nombreLibro ||
                "—"
            )}

        </p>


        <p>

            <strong>
                Código:
            </strong>

            ${escapeHtml(
                formatearCodigo(
                    prestamo.codigoLibro
                )
            )}

        </p>


        <p>

            <strong>
                Fecha del préstamo:
            </strong>

            ${formatearFecha(
                prestamo.fechaPrestamo
            )}

        </p>


        <p>

            <strong>
                Fecha límite:
            </strong>

            ${formatearFecha(
                prestamo.fechaDevolucion
            )}

        </p>


        <div class="campo-comentario">

            <label
                for="comentarioDevolucion"
            >
                Comentarios de la devolución
            </label>


            <select
                id="comentarioDevolucion"
            >

                <option value="">
                    Vacío
                </option>

                <option value="Roto">
                    Roto
                </option>

                <option value="Mojado">
                    Mojado
                </option>

                <option value="Manchado">
                    Manchado
                </option>

                <option value="Extraviado">
                    Extraviado
                </option>

            </select>


            <div
                id="avisoExtraviado"
                class="aviso-extraviado"
            >
                ⚠️ Si selecciona <strong>Extraviado</strong>,
                el libro quedará en estado <strong>Baja</strong>
                y no estará disponible para nuevos préstamos.
            </div>

        </div>

    `;


    detalle.style.display =
        "block";


    confirmacion.style.display =
        "block";


    const selectComentario =
        document.getElementById(
            "comentarioDevolucion"
        );


    const avisoExtraviado =
        document.getElementById(
            "avisoExtraviado"
        );


    selectComentario.addEventListener(

        "change",

        function() {


            if (
                selectComentario.value ===
                "Extraviado"
            ) {


                avisoExtraviado.style.display =
                    "block";


            } else {


                avisoExtraviado.style.display =
                    "none";

            }

        }

    );


    detalle.scrollIntoView({

        behavior:
            "smooth",

        block:
            "nearest"

    });

}


/* =========================================================
   CONFIRMAR DEVOLUCIÓN
========================================================= */

async function confirmarDevolucion() {


    if (!prestamoSeleccionado) {


        mostrarMensaje(

            "Seleccione un préstamo.",

            "error"

        );


        return;

    }


    const selectComentario =
        document.getElementById(
            "comentarioDevolucion"
        );


    const comentario =
        selectComentario
            ? selectComentario.value
            : "";


    try {


        const fechaReal =
            new Date();


        /*
         * 1. Actualizar préstamo
         */

        const {
            error: errorPrestamo
        } = await supabaseClient

            .from("prestamos")

            .update({

                estado:
                    "Devuelto",

                fechaDevolucionReal:
                    fechaReal.toISOString(),

                comentarios:
                    comentario ||
                    null

            })

            .eq(

                "id",

                prestamoSeleccionado.id

            );


        if (errorPrestamo) {

            throw errorPrestamo;

        }


        /*
         * 2. Buscar el libro exacto
         */

        const {
            data: libros,
            error: errorLibroConsulta
        } = await supabaseClient

            .from("libros")

            .select(
                "id, codigoLibro"
            );


        if (errorLibroConsulta) {

            throw errorLibroConsulta;

        }


        const codigoNormalizado =
            normalizarCodigo(

                prestamoSeleccionado.codigoLibro

            );


        const libro =
            (libros || []).find(

                item =>

                    normalizarCodigo(
                        item.codigoLibro
                    ) ===
                    codigoNormalizado

            );


        /*
         * 3. Determinar el estado final
         */

        const estadoLibro =
            comentario ===
            "Extraviado"

                ? "Baja"

                : "Disponible";


        /*
         * 4. Cambiar estado del libro
         */

        if (libro) {


            const {
                error: errorLibroUpdate
            } = await supabaseClient

                .from("libros")

                .update({

                    estado:
                        estadoLibro

                })

                .eq(

                    "id",

                    libro.id

                );


            if (errorLibroUpdate) {

                throw errorLibroUpdate;

            }

        }


        /*
         * 5. Mensaje final
         */

        if (
            comentario ===
            "Extraviado"
        ) {


            mostrarMensaje(

                "Devolución registrada. El libro fue marcado como Baja por extravío.",

                "exito"

            );


        } else {


            mostrarMensaje(

                "Devolución registrada correctamente.",

                "exito"

            );

        }


        prestamoSeleccionado =
            null;


        detalle.style.display =
            "none";


        confirmacion.style.display =
            "none";


        await cargarDatos();


    } catch (error) {


        console.error(error);


        mostrarMensaje(

            "No fue posible registrar la devolución: " +

            (

                error.message ||

                "error desconocido"

            ),

            "error"

        );

    }

}


/* =========================================================
   CANCELAR
========================================================= */

function cancelarDevolucion() {


    prestamoSeleccionado =
        null;


    detalle.style.display =
        "none";


    confirmacion.style.display =
        "none";

}


/* =========================================================
   BUSCAR
========================================================= */

function buscar() {


    const texto =
        normalizarTexto(
            buscarInput.value
        );


    if (!texto) {


        mostrarPrestamos(
            prestamos
        );


        limpiarMensaje();


        return;

    }


    const resultados =
        prestamos.filter(

            prestamo => {


                return (

                    normalizarTexto(
                        prestamo.FamiliaId
                    )
                    .includes(texto)

                    ||

                    normalizarTexto(
                        prestamo.PersonaId
                    )
                    .includes(texto)

                    ||

                    normalizarTexto(
                        prestamo.Nombres
                    )
                    .includes(texto)

                    ||

                    normalizarTexto(
                        prestamo.Apellidos
                    )
                    .includes(texto)

                    ||

                    normalizarTexto(
                        prestamo.codigoLibro
                    )
                    .includes(texto)

                    ||

                    normalizarTexto(
                        prestamo.nombreLibro
                    )
                    .includes(texto)

                );

            }

        );


    mostrarPrestamos(
        resultados
    );


    if (!resultados.length) {


        mostrarMensaje(

            "No se encontraron préstamos con ese criterio.",

            "error"

        );


    } else {


        limpiarMensaje();

    }

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizarTexto(
    valor
) {


    return String(
        valor ?? ""
    )

        .normalize(
            "NFD"
        )

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .toLowerCase()

        .trim();

}


/* =========================================================
   FECHA SOLO DÍA
========================================================= */

function obtenerFechaSoloDia(
    fecha
) {


    if (!fecha) {

        return null;

    }


    const texto =
        String(
            fecha
        ).trim();


    if (!texto) {

        return null;

    }


    if (
        /^\d{4}-\d{2}-\d{2}/
            .test(texto)
    ) {


        const partes =
            texto
                .substring(
                    0,
                    10
                )
                .split("-");


        return new Date(

            Number(
                partes[0]
            ),

            Number(
                partes[1]
            ) - 1,

            Number(
                partes[2]
            )

        );

    }


    const match =
        texto.match(

            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/

        );


    if (match) {


        return new Date(

            Number(
                match[3]
            ),

            Number(
                match[2]
            ) - 1,

            Number(
                match[1]
            )

        );

    }


    const fechaConvertida =
        new Date(
            texto
        );


    if (
        isNaN(
            fechaConvertida.getTime()
        )
    ) {

        return null;

    }


    return new Date(

        fechaConvertida.getFullYear(),

        fechaConvertida.getMonth(),

        fechaConvertida.getDate()

    );

}


/* =========================================================
   OBTENER HOY
========================================================= */

function obtenerHoy() {


    const ahora =
        new Date();


    return new Date(

        ahora.getFullYear(),

        ahora.getMonth(),

        ahora.getDate()

    );

}


/* =========================================================
   FORMATO FECHA
========================================================= */

function formatearFecha(
    fecha
) {


    const fechaObj =
        obtenerFechaSoloDia(
            fecha
        );


    if (!fechaObj) {

        return "";

    }


    const dia =
        String(
            fechaObj.getDate()
        )
        .padStart(
            2,
            "0"
        );


    const mes =
        String(
            fechaObj.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const anio =
        fechaObj.getFullYear();


    return `${dia}/${mes}/${anio}`;

}


/* =========================================================
   NORMALIZAR CÓDIGO
========================================================= */

function normalizarCodigo(
    codigo
) {


    return String(
        codigo ?? ""
    )

        .replace(
            /\D/g,
            ""
        )

        .replace(
            /^0+/,
            ""
        )

        || "0";

}


/* =========================================================
   FORMATEAR CÓDIGO
========================================================= */

function formatearCodigo(
    codigo
) {


    const valor =
        normalizarCodigo(
            codigo
        );


    if (
        valor ===
        "0"
    ) {

        return "—";

    }


    return valor.padStart(
        8,
        "0"
    );

}


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
    texto,
    tipo
) {


    mensaje.textContent =
        texto;


    mensaje.className =
        "mensaje " +
        tipo;

}


function limpiarMensaje() {


    mensaje.textContent =
        "";


    mensaje.className =
        "mensaje";

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(
    valor
) {


    return String(
        valor ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   EVENTOS
========================================================= */

document
    .getElementById(
        "btnBuscar"
    )
    .addEventListener(

        "click",

        buscar

    );


document
    .getElementById(
        "btnConfirmar"
    )
    .addEventListener(

        "click",

        confirmarDevolucion

    );


document
    .getElementById(
        "btnCancelar"
    )
    .addEventListener(

        "click",

        cancelarDevolucion

    );


buscarInput
    .addEventListener(

        "keydown",

        function(event) {


            if (
                event.key ===
                "Enter"
            ) {

                buscar();

            }

        }

    );


</script>
