<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - Biblioteca</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #2c3e50;
            font-size: 14px;
        }

        header {
            background: #34495e;
            color: white;
            padding: 16px 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .boton-volver {
            position: absolute;
            right: 20px;
            top: 14px;
            background: #3d5368;
            color: white;
            border: 1px solid rgba(255,255,255,0.65);
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .boton-volver:hover {
            background: #465f76;
        }

        .contenedor {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* FILTROS */

        .filtros {
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        .filtros h2 {
            margin: 0 0 12px 0;
            font-size: 17px;
        }

        .fila-filtros {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 10px;
            align-items: end;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
            color: #566573;
        }

        .campo input,
        .campo select {
            width: 100%;
            height: 34px;
            padding: 6px 8px;
            border: 1px solid #ccd1d1;
            border-radius: 5px;
            font-size: 13px;
            background: white;
        }

        .campo input:focus,
        .campo select:focus {
            outline: none;
            border-color: #3498db;
        }

        .botones-filtros {
            display: flex;
            gap: 7px;
            margin-top: 12px;
        }

        .boton {
            border: none;
            padding: 8px 13px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .boton-buscar {
            background: #3498db;
            color: white;
        }

        .boton-limpiar {
            background: #95a5a6;
            color: white;
        }

        .boton:hover {
            opacity: 0.9;
        }

        /* ESTADÍSTICAS */

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .tarjeta {
            background: white;
            border-radius: 8px;
            padding: 11px 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 65px;
        }

        .icono {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .icono-personas {
            background: #e8f4fd;
        }

        .icono-libros {
            background: #eafaf1;
        }

        .icono-activos {
            background: #fef5e7;
        }

        .icono-vencidos {
            background: #fdedec;
        }

        .tarjeta-info {
            display: flex;
            flex-direction: column;
        }

        .tarjeta-titulo {
            font-size: 11px;
            color: #7f8c8d;
            margin-bottom: 2px;
        }

        .tarjeta-numero {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* RESULTADOS */

        .resultados {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .resultados h2 {
            margin: 0 0 12px 0;
            font-size: 17px;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 930px;
        }

        thead {
            background: #34495e;
            color: white;
        }

        th {
            padding: 9px 7px;
            text-align: center;
            font-size: 11px;
            white-space: nowrap;
        }

        td {
            padding: 8px 7px;
            border-bottom: 1px solid #ecf0f1;
            text-align: center;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f8f9f9;
        }

        .estado {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }

        .estado-prestado {
            background: #d6eaf8;
            color: #21618c;
        }

        .estado-vencido {
            background: #fadbd8;
            color: #922b21;
        }

        .estado-devuelto {
            background: #d5f5e3;
            color: #196f3d;
        }

        .tipo {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }

        .tipo-afiliado {
            background: #e8f4fd;
            color: #21618c;
        }

        .tipo-colaborador {
            background: #fef5e7;
            color: #935116;
        }

        .sitio {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            background: #e8daef;
            color: #6c3483;
        }

        .sin-resultados {
            text-align: center;
            padding: 30px 10px;
            color: #7f8c8d;
            font-size: 13px;
        }

        /* PAGINACIÓN */

        .paginacion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .boton-paginacion {
            background: #34495e;
            color: white;
            border: 1px solid #34495e;
            padding: 7px 13px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .boton-paginacion:hover:not(:disabled) {
            background: #3d5368;
        }

        .boton-paginacion:disabled {
            background: #d5d8dc;
            border-color: #d5d8dc;
            color: #7f8c8d;
            cursor: not-allowed;
        }

        .info-paginacion {
            font-size: 12px;
            color: #566573;
            font-weight: bold;
            min-width: 90px;
            text-align: center;
        }

        /* RESPONSIVO */

        @media (max-width: 1200px) {

            .fila-filtros {
                grid-template-columns: repeat(4, 1fr);
            }

            .estadisticas {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 900px) {

            .fila-filtros {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 20px;
            }

            .boton-volver {
                right: 10px;
                top: 12px;
                padding: 6px 9px;
                font-size: 11px;
            }

            .contenedor {
                padding: 0 10px;
                margin-top: 15px;
            }

            .fila-filtros {
                grid-template-columns: 1fr;
            }

            .estadisticas {
                grid-template-columns: 1fr 1fr;
            }

            .tarjeta {
                min-height: 58px;
                padding: 8px;
            }

            .icono {
                width: 32px;
                height: 32px;
                min-width: 32px;
                font-size: 16px;
            }

            .tarjeta-numero {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<header>
    <button class="boton-volver" onclick="volverAtras()">Volver atrás</button>
    <h1>Buscar</h1>
</header>

<div class="contenedor">

    <!-- FILTROS -->

    <div class="filtros">

        <h2>🔎 Filtros de búsqueda</h2>

        <div class="fila-filtros">

            <div class="campo">
                <label for="busquedaGeneral">Búsqueda general</label>
                <input
                    type="text"
                    id="busquedaGeneral"
                    placeholder="Nombre, familia, persona, colaborador o libro..."
                >
            </div>

            <div class="campo">
                <label for="familia">Familia / Colaborador</label>
                <input
                    type="text"
                    id="familia"
                    placeholder="F1068"
                >
            </div>

            <div class="campo">
                <label for="codigoLibro">Código libro</label>
                <input
                    type="text"
                    id="codigoLibro"
                    placeholder="00000001"
                >
            </div>

            <div class="campo">
                <label for="sitio">Sitio</label>
                <select id="sitio">
                    <option value="">Todos los sitios</option>
                </select>
            </div>

            <div class="campo">
                <label for="biblioteca">Biblioteca</label>
                <select id="biblioteca">
                    <option value="">Todas las bibliotecas</option>
                    <option value="F">F</option>
                    <option value="M">M</option>
                    <option value="N">N</option>
                    <option value="R">R</option>
                    <option value="Z">Z</option>
                    <option value="NE">NE</option>
                </select>
            </div>

            <div class="campo">
                <label for="estado">Estado</label>
                <select id="estado">
                    <option value="Todos">Todos</option>
                    <option value="Prestado">Prestado</option>
                    <option value="Vencido">Vencido</option>
                    <option value="Devuelto">Devuelto</option>
                </select>
            </div>

            <div class="campo">
                <label for="fechaDesde">Desde</label>
                <input type="date" id="fechaDesde">
            </div>

        </div>

        <div class="botones-filtros">
            <button class="boton boton-buscar" onclick="buscar()">🔎 Buscar</button>
            <button class="boton boton-limpiar" onclick="limpiarFiltros()">Limpiar</button>
        </div>

    </div>

    <!-- ESTADÍSTICAS -->

    <div class="estadisticas">

        <div class="tarjeta">
            <div class="icono icono-personas">👤</div>
            <div class="tarjeta-info">
                <div class="tarjeta-titulo">Personas encontradas</div>
                <div class="tarjeta-numero" id="totalPersonas">0</div>
            </div>
        </div>

        <div class="tarjeta">
            <div class="icono icono-libros">📚</div>
            <div class="tarjeta-info">
                <div class="tarjeta-titulo">Libros relacionados</div>
                <div class="tarjeta-numero" id="totalLibros">0</div>
            </div>
        </div>

        <div class="tarjeta">
            <div class="icono icono-activos">📖</div>
            <div class="tarjeta-info">
                <div class="tarjeta-titulo">Préstamos activos</div>
                <div class="tarjeta-numero" id="totalActivos">0</div>
            </div>
        </div>

        <div class="tarjeta">
            <div class="icono icono-vencidos">⚠️</div>
            <div class="tarjeta-info">
                <div class="tarjeta-titulo">Préstamos vencidos</div>
                <div class="tarjeta-numero" id="totalVencidos">0</div>
            </div>
        </div>

    </div>

    <!-- RESULTADOS -->

    <div class="resultados" id="seccionResultados">

        <h2>Resultados</h2>

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>
                        <th>Tipo</th>
                        <th>Sitio</th>
                        <th>Familia</th>
                        <th>Persona / Código</th>
                        <th>Nombre</th>
                        <th>Código</th>
                        <th>Libro</th>
                        <th>Préstamo</th>
                        <th>Devolución</th>
                        <th>Devolución real</th>
                        <th>Estado</th>
                    </tr>

                </thead>

                <tbody id="tablaResultados">

                    <tr>
                        <td colspan="11" class="sin-resultados">
                            Realiza una búsqueda para mostrar resultados.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

        <div class="paginacion" id="paginacion">

            <button
                class="boton-paginacion"
                id="botonAnterior"
                onclick="paginaAnterior()"
            >
                ← Anterior
            </button>

            <span
                class="info-paginacion"
                id="infoPaginacion"
            >
                Página 1
            </span>

            <button
                class="boton-paginacion"
                id="botonSiguiente"
                onclick="paginaSiguiente()"
            >
                Siguiente →
            </button>

        </div>

    </div>

</div>

<script>

let prestamos = [];
let resultadosActuales = [];
let mapaLibros = new Map();

const REGISTROS_POR_PAGINA = 25;

let paginaActual = 1;

/* =========================
   IDENTIFICAR COLABORADOR
========================= */

function esColaborador(prestamo) {

    const tipo = normalizar(
        prestamo.tipoPrestamo ||
        prestamo.TipoPrestamo ||
        ""
    );

    return (
        tipo === "colaborador" ||
        !!prestamo.CodigoColaborador
    );
}

/* =========================
   DATOS DEL COLABORADOR
========================= */

function obtenerCodigoColaborador(prestamo) {

    return (
        prestamo.CodigoColaborador ||
        prestamo.codigoColaborador ||
        "-"
    );
}

function obtenerNombreColaborador(prestamo) {

    return (
        prestamo.NombreColaborador ||
        prestamo.nombreColaborador ||
        "-"
    );
}

function obtenerAreaColaborador(prestamo) {

    return (
        prestamo.AreaColaborador ||
        prestamo.areaColaborador ||
        "-"
    );
}

/* =========================
   OBTENER SITIO
========================= */

function obtenerSitio(prestamo) {

    return (
        prestamo.Sitio ||
        prestamo.sitio ||
        "-"
    );
}

/* =========================
   NORMALIZAR CÓDIGO LIBRO
========================= */

function normalizarCodigoLibro(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    const texto =
        String(valor).trim();

    if (/^\d+$/.test(texto)) {
        return String(
            parseInt(texto, 10)
        );
    }

    return texto.toLowerCase();
}

/* =========================
   CARGAR LIBROS
========================= */

async function cargarLibros() {

    mapaLibros = new Map();

    let desde = 0;
    const cantidad = 1000;

    while (true) {

        const { data, error } =
            await supabaseClient
                .from("libros")
                .select(
                    "codigoLibro, nombreLibro, Biblioteca"
                )
                .range(
                    desde,
                    desde + cantidad - 1
                );

        if (error) {

            console.error(error);

            alert(
                "No se pudieron cargar los datos de los libros."
            );

            return false;
        }

        if (!data || data.length === 0) {
            break;
        }

        data.forEach(libro => {

            const codigo =
                normalizarCodigoLibro(
                    libro.codigoLibro
                );

            if (codigo) {

                mapaLibros.set(
                    codigo,
                    libro
                );
            }
        });

        if (data.length < cantidad) {
            break;
        }

        desde += cantidad;
    }

    return true;
}

/* =========================
   CARGAR SITIOS
========================= */

function cargarSitios() {

    const select =
        document.getElementById("sitio");

    const sitios =
        new Set();

    prestamos.forEach(prestamo => {

        const sitio =
            obtenerSitio(prestamo);

        if (
            sitio &&
            sitio !== "-"
        ) {
            sitios.add(
                String(sitio).trim()
            );
        }
    });

    const sitiosOrdenados =
        Array.from(sitios)
            .sort((a, b) =>
                a.localeCompare(
                    b,
                    "es",
                    { sensitivity: "base" }
                )
            );

    select.innerHTML = `
        <option value="">Todos los sitios</option>
    `;

    sitiosOrdenados.forEach(sitio => {

        const option =
            document.createElement("option");

        option.value = sitio;
        option.textContent = sitio;

        select.appendChild(option);
    });
}

/* =========================
   CARGAR PRÉSTAMOS
========================= */

async function cargarPrestamos() {

    prestamos = [];

    let desde = 0;
    const cantidad = 1000;

    while (true) {

        const { data, error } =
            await supabaseClient
                .from("prestamos")
                .select("*")
                .order(
                    "fechaPrestamo",
                    { ascending: false }
                )
                .range(
                    desde,
                    desde + cantidad - 1
                );

        if (error) {

            console.error(error);

            alert(
                "No se pudieron cargar los préstamos."
            );

            return;
        }

        if (!data || data.length === 0) {
            break;
        }

        prestamos.push(...data);

        if (data.length < cantidad) {
            break;
        }

        desde += cantidad;
    }

    cargarSitios();

    resultadosActuales = prestamos;
    paginaActual = 1;

    mostrarResultados(resultadosActuales);
}

/* =========================
   NORMALIZAR
========================= */

function normalizar(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    return String(valor)
        .toLowerCase()
        .trim();
}

/* =========================
   OBTENER BIBLIOTECA
========================= */

function obtenerBiblioteca(prestamo) {

    const codigo =
        normalizarCodigoLibro(
            prestamo.codigoLibro
        );

    const libro =
        mapaLibros.get(codigo);

    return libro?.Biblioteca || "";
}

/* =========================
   ESTADO DEL PRÉSTAMO
========================= */

function obtenerEstado(prestamo) {

    if (prestamo.estado === "Devuelto") {
        return "Devuelto";
    }

    if (!prestamo.fechaDevolucion) {
        return "Prestado";
    }

    const fechaLimite =
        new Date(
            prestamo.fechaDevolucion
        );

    const ahora =
        new Date();

    if (fechaLimite < ahora) {
        return "Vencido";
    }

    return "Prestado";
}

/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "-";
    }

    const fechaObj =
        new Date(fecha);

    if (isNaN(fechaObj.getTime())) {
        return "-";
    }

    return fechaObj.toLocaleDateString("es-GT");
}

/* =========================
   BUSCAR
========================= */

function buscar() {

    const busquedaGeneral =
        normalizar(
            document.getElementById(
                "busquedaGeneral"
            ).value
        );

    const familia =
        normalizar(
            document.getElementById(
                "familia"
            ).value
        );

    const codigoLibro =
        normalizar(
            document.getElementById(
                "codigoLibro"
            ).value
        );

    const sitio =
        normalizar(
            document.getElementById(
                "sitio"
            ).value
        );

    const bibliotecaSeleccionada =
        normalizar(
            document.getElementById(
                "biblioteca"
            ).value
        );

    const estadoSeleccionado =
        document.getElementById(
            "estado"
        ).value;

    const fechaDesde =
        document.getElementById(
            "fechaDesde"
        ).value;

    resultadosActuales =
        prestamos.filter(prestamo => {

            const colaborador =
                esColaborador(prestamo);

            const estado =
                obtenerEstado(prestamo);

            const codigoColaborador =
                obtenerCodigoColaborador(
                    prestamo
                );

            const nombreColaborador =
                obtenerNombreColaborador(
                    prestamo
                );

            const areaColaborador =
                obtenerAreaColaborador(
                    prestamo
                );

            const sitioPrestamo =
                obtenerSitio(prestamo);

            const biblioteca =
                obtenerBiblioteca(prestamo);

            /* =========================
               BÚSQUEDA GENERAL
            ========================= */

            const textoGeneral = [

                prestamo.FamiliaId,
                prestamo.PersonaId,
                prestamo.Nombres,
                prestamo.Apellidos,

                prestamo.codigoLibro,
                prestamo.nombreLibro,

                prestamo.tipoPrestamo,

                codigoColaborador,
                nombreColaborador,
                areaColaborador,

                sitioPrestamo,
                biblioteca

            ]
            .map(normalizar)
            .join(" ");

            if (
                busquedaGeneral &&
                !textoGeneral.includes(
                    busquedaGeneral
                )
            ) {
                return false;
            }

            /* =========================
               FILTRO FAMILIA / COLABORADOR
            ========================= */

            if (familia) {

                const coincideFamilia =
                    normalizar(
                        prestamo.FamiliaId
                    ).includes(familia);

                const coincideCodigoColaborador =
                    normalizar(
                        codigoColaborador
                    ).includes(familia);

                if (
                    !coincideFamilia &&
                    !coincideCodigoColaborador
                ) {
                    return false;
                }
            }

            /* =========================
               FILTRO CÓDIGO LIBRO
            ========================= */

            if (
                codigoLibro &&
                !normalizar(
                    prestamo.codigoLibro
                ).includes(codigoLibro)
            ) {
                return false;
            }

            /* =========================
               FILTRO SITIO
            ========================= */

            if (
                sitio &&
                normalizar(
                    sitioPrestamo
                ) !== sitio
            ) {
                return false;
            }

            /* =========================
               FILTRO BIBLIOTECA
            ========================= */

            if (
                bibliotecaSeleccionada &&
                normalizar(
                    biblioteca
                ) !== bibliotecaSeleccionada
            ) {
                return false;
            }

            /* =========================
               FILTRO ESTADO
            ========================= */

            if (
                estadoSeleccionado !== "Todos" &&
                estado !== estadoSeleccionado
            ) {
                return false;
            }

            /* =========================
               FILTRO FECHA
            ========================= */

            if (fechaDesde) {

                const fechaPrestamo =
                    new Date(
                        prestamo.fechaPrestamo
                    );

                const desde =
                    new Date(
                        fechaDesde +
                        "T00:00:00"
                    );

                if (
                    fechaPrestamo < desde
                ) {
                    return false;
                }
            }

            return true;
        });

    paginaActual = 1;

    mostrarResultados(
        resultadosActuales
    );
}

/* =========================
   MOSTRAR RESULTADOS
========================= */

function mostrarResultados(lista) {

    const tbody =
        document.getElementById(
            "tablaResultados"
        );

    tbody.innerHTML = "";

    const personas =
        new Set();

    const colaboradores =
        new Set();

    const libros =
        new Set();

    let activos = 0;
    let vencidos = 0;

    lista.forEach(prestamo => {

        const estado =
            obtenerEstado(prestamo);

        if (esColaborador(prestamo)) {

            const codigo =
                obtenerCodigoColaborador(
                    prestamo
                );

            if (
                codigo &&
                codigo !== "-"
            ) {
                colaboradores.add(
                    codigo
                );
            }

        } else {

            if (prestamo.PersonaId) {
                personas.add(
                    prestamo.PersonaId
                );
            }
        }

        if (prestamo.codigoLibro) {
            libros.add(
                normalizarCodigoLibro(
                    prestamo.codigoLibro
                )
            );
        }

        if (estado === "Prestado") {
            activos++;
        }

        if (estado === "Vencido") {
            vencidos++;
        }
    });

    /*
       Personas encontradas incluye:
       afiliados + colaboradores
    */

    document.getElementById(
        "totalPersonas"
    ).textContent =
        personas.size +
        colaboradores.size;

    document.getElementById(
        "totalLibros"
    ).textContent =
        libros.size;

    document.getElementById(
        "totalActivos"
    ).textContent =
        activos;

    document.getElementById(
        "totalVencidos"
    ).textContent =
        vencidos;

    /* =========================
       PAGINACIÓN
    ========================= */

    const totalPaginas =
        Math.max(
            1,
            Math.ceil(
                lista.length /
                REGISTROS_POR_PAGINA
            )
        );

    if (paginaActual > totalPaginas) {
        paginaActual = totalPaginas;
    }

    const inicio =
        (paginaActual - 1) *
        REGISTROS_POR_PAGINA;

    const fin =
        inicio +
        REGISTROS_POR_PAGINA;

    const registrosPagina =
        lista.slice(
            inicio,
            fin
        );

    if (lista.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="11" class="sin-resultados">
                    No se encontraron resultados.
                </td>
            </tr>
        `;

        actualizarPaginacion(0);

        return;
    }

    registrosPagina.forEach(prestamo => {

        const estado =
            obtenerEstado(prestamo);

        let claseEstado = "";

        if (estado === "Prestado") {
            claseEstado =
                "estado-prestado";
        }

        if (estado === "Vencido") {
            claseEstado =
                "estado-vencido";
        }

        if (estado === "Devuelto") {
            claseEstado =
                "estado-devuelto";
        }

        const colaborador =
            esColaborador(prestamo);

        let tipoTexto = "";
        let tipoClase = "";

        let familia = "";
        let personaCodigo = "";
        let nombre = "";

        if (colaborador) {

            tipoTexto =
                "Colaborador";

            tipoClase =
                "tipo-colaborador";

            familia = "-";

            personaCodigo =
                obtenerCodigoColaborador(
                    prestamo
                );

            nombre =
                obtenerNombreColaborador(
                    prestamo
                );

        } else {

            tipoTexto =
                "Afiliado";

            tipoClase =
                "tipo-afiliado";

            familia =
                prestamo.FamiliaId ||
                "-";

            personaCodigo =
                prestamo.PersonaId ||
                "-";

            nombre =
                `${prestamo.Nombres || ""} ${prestamo.Apellidos || ""}`
                    .trim();

            if (!nombre) {
                nombre = "-";
            }
        }

        const sitio =
            obtenerSitio(prestamo);

        const fechaDevolucionReal =
            prestamo.fechaDevolucionReal
                ? formatearFecha(
                    prestamo.fechaDevolucionReal
                )
                : "-";

        const fila =
            document.createElement("tr");

        fila.innerHTML = `

            <td>
                <span class="tipo ${tipoClase}">
                    ${tipoTexto}
                </span>
            </td>

            <td>
                <span class="sitio">
                    ${sitio}
                </span>
            </td>

            <td>
                ${familia}
            </td>

            <td>
                ${personaCodigo}
            </td>

            <td>
                ${nombre}
            </td>

            <td>
                ${prestamo.codigoLibro || "-"}
            </td>

            <td>
                ${prestamo.nombreLibro || "-"}
            </td>

            <td>
                ${formatearFecha(
                    prestamo.fechaPrestamo
                )}
            </td>

            <td>
                ${formatearFecha(
                    prestamo.fechaDevolucion
                )}
            </td>

            <td>
                ${fechaDevolucionReal}
            </td>

            <td>
                <span class="estado ${claseEstado}">
                    ${estado}
                </span>
            </td>

        `;

        tbody.appendChild(fila);
    });

    actualizarPaginacion(
        lista.length
    );
}

/* =========================
   ACTUALIZAR PAGINACIÓN
========================= */

function actualizarPaginacion(totalRegistros) {

    const botonAnterior =
        document.getElementById(
            "botonAnterior"
        );

    const botonSiguiente =
        document.getElementById(
            "botonSiguiente"
        );

    const info =
        document.getElementById(
            "infoPaginacion"
        );

    const totalPaginas =
        Math.max(
            1,
            Math.ceil(
                totalRegistros /
                REGISTROS_POR_PAGINA
            )
        );

    botonAnterior.disabled =
        paginaActual <= 1;

    botonSiguiente.disabled =
        paginaActual >= totalPaginas;

    info.textContent =
        `Página ${paginaActual} de ${totalPaginas}`;
}

/* =========================
   IR AL INICIO DE RESULTADOS
========================= */

function subirAResultados() {

    const seccion =
        document.getElementById(
            "seccionResultados"
        );

    if (!seccion) {
        return;
    }

    seccion.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

/* =========================
   PÁGINA ANTERIOR
========================= */

function paginaAnterior() {

    if (paginaActual <= 1) {
        return;
    }

    paginaActual--;

    mostrarResultados(
        resultadosActuales
    );

    subirAResultados();
}

/* =========================
   PÁGINA SIGUIENTE
========================= */

function paginaSiguiente() {

    const totalPaginas =
        Math.max(
            1,
            Math.ceil(
                resultadosActuales.length /
                REGISTROS_POR_PAGINA
            )
        );

    if (paginaActual >= totalPaginas) {
        return;
    }

    paginaActual++;

    mostrarResultados(
        resultadosActuales
    );

    subirAResultados();
}

/* =========================
   LIMPIAR FILTROS
========================= */

function limpiarFiltros() {

    document.getElementById(
        "busquedaGeneral"
    ).value = "";

    document.getElementById(
        "familia"
    ).value = "";

    document.getElementById(
        "codigoLibro"
    ).value = "";

    document.getElementById(
        "sitio"
    ).value = "";

    document.getElementById(
        "biblioteca"
    ).value = "";

    document.getElementById(
        "estado"
    ).value = "Todos";

    document.getElementById(
        "fechaDesde"
    ).value = "";

    resultadosActuales =
        prestamos;

    paginaActual = 1;

    mostrarResultados(
        resultadosActuales
    );
}

/* =========================
   FILTROS AUTOMÁTICOS
========================= */

function activarFiltrosAutomaticos() {

    const ids = [
        "busquedaGeneral",
        "familia",
        "codigoLibro",
        "sitio",
        "biblioteca",
        "estado",
        "fechaDesde"
    ];

    ids.forEach(id => {

        const elemento =
            document.getElementById(id);

        if (!elemento) {
            return;
        }

        elemento.addEventListener(
            "input",
            function() {
                buscar();
            }
        );

        elemento.addEventListener(
            "change",
            function() {
                buscar();
            }
        );
    });
}

/* =========================
   ENTER PARA BUSCAR
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            document.activeElement.tagName === "INPUT"
        ) {
            buscar();
        }

    }
);

/* =========================
   VOLVER
========================= */

function volverAtras() {

    window.history.back();
}

/* =========================
   INICIO
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        activarFiltrosAutomaticos();

        const librosCargados =
            await cargarLibros();

        if (!librosCargados) {
            return;
        }

        cargarPrestamos();

    }
);

</script>
