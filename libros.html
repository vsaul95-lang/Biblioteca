<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Libros - Biblioteca</title>


    <!-- =========================================================
         OCULTAR LA PÁGINA MIENTRAS SE COMPRUEBAN LOS PERMISOS
    ========================================================== -->

    <style>

        html {
            visibility: hidden;
        }

    </style>


    <!-- =========================================================
         SUPABASE Y LÓGICA DE LA PÁGINA
    ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js?v=1002"></script>

    <script src="libros.js?v=1002"></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


    <!-- =========================================================
         PROTECCIÓN DE LA PÁGINA
    ========================================================== -->

    <script>

        window.librosAutorizado = false;


        window.librosAuth =
            (async function protegerLibros() {

                try {

                    const autorizado =
                        await window.protegerPagina();


                    if (!autorizado) {

                        window.location.replace(
                            "index.html"
                        );

                        return false;

                    }


                    /*
                     * Tanto Usuario como Administrador
                     * pueden entrar a Libros.
                     */

                    if (
                        !window.esUsuario() &&
                        !window.esAdministrador()
                    ) {

                        window.location.replace(
                            "index.html"
                        );

                        return false;

                    }


                    window.librosAutorizado =
                        true;


                    document.documentElement.style.visibility =
                        "visible";


                    return true;


                } catch (error) {

                    console.error(
                        "Error al comprobar permisos de libros:",
                        error
                    );


                    window.location.replace(
                        "index.html"
                    );


                    return false;

                }

            })();

    </script>


    <!-- =========================================================
         ESTILOS
    ========================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fa;
            color: #263238;
            font-size: 14px;
        }

        .encabezado {
            background: #009ddc;
            color: white;
            padding: 14px 20px;
        }

        .encabezado-contenido {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 54px;
        }

        .encabezado-titulo {
            margin: 0;
            font-size: 22px;
            text-align: center;
            color: white;
            font-weight: bold;
        }

        .volver {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.15);
            padding: 7px 12px;
            border-radius: 6px;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .volver:hover {
            background: rgba(0, 0, 0, 0.24);
        }

        .contenedor {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .titulo-pagina {
            margin-bottom: 15px;
        }

        .titulo-pagina h2 {
            margin: 0 0 4px;
            font-size: 23px;
        }

        .titulo-pagina p {
            margin: 0;
            color: #607d8b;
            font-size: 13px;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .tarjeta-estadistica {
            background: white;
            border: 1px solid #e1e8eb;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .estadistica-icono {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: #e8f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            flex-shrink: 0;
        }

        .estadistica-numero {
            font-size: 21px;
            font-weight: bold;
            line-height: 1;
        }

        .estadistica-texto {
            margin-top: 3px;
            color: #607d8b;
            font-size: 11px;
        }

        .seccion {
            background: white;
            border: 1px solid #e1e8eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 16px;
        }

        .seccion-titulo {
            margin: 0 0 11px;
            font-size: 17px;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 9px;
            align-items: end;
        }

        .formulario-libro {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .formulario-libro .campo-codigo {
            grid-column: span 1;
        }

        .formulario-libro .campo-nombre {
            grid-column: span 2;
        }

        .formulario-libro .campo-biblioteca {
            grid-column: span 1;
        }

        .formulario-libro .campo-completo {
            grid-column: span 1;
        }

        .formulario-libro .acciones-formulario {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            margin-top: 2px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .campo label {
            font-size: 11px;
            font-weight: bold;
            color: #455a64;
        }

        .campo input,
        .campo select {
            width: 100%;
            height: 36px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            padding: 0 9px;
            font-size: 12px;
            background: white;
            color: #263238;
        }

        .campo input:focus,
        .campo select:focus {
            outline: none;
            border-color: #009ddc;
            box-shadow: 0 0 0 2px rgba(0, 157, 220, 0.10);
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 8px 13px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-principal {
            background: #009ddc;
            color: white;
        }

        .btn-principal:hover {
            background: #0089c0;
        }

        .btn-secundario {
            background: #e8f1f4;
            color: #37474f;
        }

        .btn-secundario:hover {
            background: #d7e3e8;
        }

        .btn-importar {
            background: #008bbf;
            color: white;
        }

        .btn-importar:hover {
            background: #007aa8;
        }

        .btn-baja {
            background: #fff3cd;
            color: #856404;
        }

        .btn-reactivar {
            background: #d1e7dd;
            color: #0f5132;
        }

        .btn-eliminar {
            background: #f8d7da;
            color: #842029;
        }

        .btn-editar {
            background: #d9eef7;
            color: #24576b;
        }

        .btn-pequeno {
            padding: 5px 8px;
            font-size: 10px;
            margin: 2px;
        }

        .importacion {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .importacion input[type="file"] {
            max-width: 100%;
            font-size: 12px;
        }

        .ayuda {
            margin-top: 9px;
            color: #607d8b;
            font-size: 11px;
            line-height: 1.45;
        }

        .busqueda {
            display: grid;
            grid-template-columns: minmax(180px, 2fr) minmax(125px, 1fr) minmax(125px, 1fr) minmax(120px, 1fr) minmax(120px, 1fr) auto;
            gap: 7px;
            align-items: end;
        }

        .busqueda .campo {
            min-width: 0;
        }

        .busqueda .btn-principal {
            min-width: 88px;
            white-space: nowrap;
        }

        .barra-resultados {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .resultado-texto {
            color: #546e7a;
            font-size: 12px;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1250px;
        }

        thead th {
            background: #009ddc;
            color: white;
            padding: 8px 7px;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
        }

        tbody td {
            border-bottom: 1px solid #eceff1;
            padding: 7px 7px;
            font-size: 11px;
            text-align: center;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f4fbfd;
        }

        .texto-izquierda {
            text-align: left !important;
        }

        .nombre-libro {
            min-width: 230px;
        }

        .autor-libro {
            min-width: 170px;
        }

        .genero-libro {
            min-width: 130px;
        }

        .editorial-libro {
            min-width: 130px;
        }

        .biblioteca {
            font-weight: bold;
            color: #37474f;
        }

        .estado {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .estado-disponible {
            background: #d1e7dd;
            color: #0f5132;
        }

        .estado-prestado {
            background: #fff3cd;
            color: #856404;
        }

        .estado-baja {
            background: #e0e0e0;
            color: #455a64;
        }

        .mensaje {
            display: none;
            padding: 9px 11px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
        }

        .mensaje-exito {
            background: #d1e7dd;
            color: #0f5132;
        }

        .mensaje-error {
            background: #f8d7da;
            color: #842029;
        }

        .sin-resultados {
            text-align: center;
            padding: 28px 18px;
            color: #78909c;
            font-size: 12px;
        }

        .sin-resultados strong {
            display: block;
            color: #546e7a;
            margin-bottom: 4px;
        }

        .seccion-bajas {
            border-top: 3px solid #90a4ae;
        }

        .paginacion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-paginacion {
            background: #e8f1f4;
            color: #37474f;
            padding: 6px 10px;
            font-size: 11px;
            min-width: 82px;
        }

        .btn-paginacion:hover:not(:disabled) {
            background: #d5e4e9;
        }

        .btn-paginacion:disabled {
            opacity: 0.45;
        }

        .pagina-info {
            color: #546e7a;
            font-size: 11px;
            padding: 0 4px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(38, 50, 56, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-contenido {
            background: white;
            width: 100%;
            max-width: 820px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,.2);
            padding: 17px;
        }

        .modal-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eceff1;
            padding-bottom: 10px;
        }

        .modal-cabecera h3 {
            margin: 0;
            font-size: 17px;
        }

        .modal-cerrar {
            background: #e8f1f4;
            color: #37474f;
            width: 30px;
            height: 30px;
            padding: 0;
            font-size: 17px;
        }

        .modal-formulario {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .modal-formulario .campo-completo {
            grid-column: 1 / -1;
        }

        .modal-acciones {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #eceff1;
        }

        .confirmacion-info {
            background: #f7f9fa;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 13px;
            font-size: 12px;
            line-height: 1.45;
        }

        footer {
            text-align: center;
            color: #90a4ae;
            font-size: 10px;
            padding: 12px 10px 22px;
        }

        footer .version,
        footer .creditos {
            margin-left: 8px;
        }

        @media (max-width: 1050px) {

            .formulario-libro {
                grid-template-columns: repeat(2, 1fr);
            }

            .formulario-libro .campo-codigo,
            .formulario-libro .campo-nombre,
            .formulario-libro .campo-biblioteca,
            .formulario-libro .campo-completo {
                grid-column: span 1;
            }

            .formulario-libro .acciones-formulario {
                grid-column: 1 / -1;
            }

            .busqueda {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .busqueda .campo:first-child {
                grid-column: 1 / -1;
            }

            .busqueda .btn-principal {
                grid-column: 1 / -1;
                justify-self: end;
            }

        }

        @media (max-width: 900px) {

            .estadisticas {
                grid-template-columns: repeat(2, 1fr);
            }

            .formulario {
                grid-template-columns: 1fr 1fr;
            }

            .formulario button {
                grid-column: span 2;
            }

        }

        @media (max-width: 650px) {

            .encabezado {
                padding: 13px 15px;
            }

            .encabezado-contenido {
                flex-direction: column;
                gap: 8px;
                min-height: auto;
            }

            .encabezado-titulo {
                position: static;
                width: 100%;
                text-align: center;
            }

            .volver {
                position: static;
                align-self: center;
                transform: none;
            }

            .contenedor {
                padding: 0 12px;
                margin-top: 17px;
            }

            .titulo-pagina h2 {
                font-size: 21px;
            }

            .estadisticas {
                grid-template-columns: 1fr 1fr;
                gap: 7px;
            }

            .tarjeta-estadistica {
                padding: 10px;
            }

            .estadistica-icono {
                width: 33px;
                height: 33px;
                font-size: 16px;
            }

            .estadistica-numero {
                font-size: 18px;
            }

            .estadistica-texto {
                font-size: 10px;
            }

            .seccion {
                padding: 13px;
                margin-bottom: 13px;
            }

            .seccion-titulo {
                font-size: 16px;
                margin-bottom: 10px;
            }

            .formulario-libro {
                grid-template-columns: 1fr;
            }

            .formulario-libro .campo-codigo,
            .formulario-libro .campo-nombre,
            .formulario-libro .campo-biblioteca,
            .formulario-libro .campo-completo {
                grid-column: auto;
            }

            .formulario-libro .acciones-formulario {
                grid-column: auto;
                flex-direction: column;
            }

            .formulario-libro .acciones-formulario button {
                width: 100%;
            }

            .busqueda {
                grid-template-columns: 1fr;
            }

            .busqueda .campo,
            .busqueda .campo:first-child {
                grid-column: auto;
            }

            .busqueda button {
                width: 100%;
            }

            .modal-formulario {
                grid-template-columns: 1fr;
            }

            .modal-formulario .campo-completo {
                grid-column: auto;
            }

            .modal-acciones {
                flex-direction: column;
            }

            .modal-acciones button {
                width: 100%;
            }

        }

        @media (max-width: 550px) {

            .encabezado {
                padding: 12px;
            }

            .encabezado-titulo {
                font-size: 20px;
            }

            .volver {
                font-size: 12px;
                padding: 6px 11px;
            }

            .contenedor {
                padding: 0 10px;
            }

            .estadisticas {
                grid-template-columns: 1fr 1fr;
                gap: 7px;
            }

            .tarjeta-estadistica {
                padding: 9px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .formulario button {
                grid-column: auto;
            }

            .modal {
                padding: 8px;
            }

            .modal-contenido {
                padding: 13px;
            }

            footer {
                padding-bottom: 18px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     ENCABEZADO
========================================================== -->

<header class="encabezado">

    <div class="encabezado-contenido">

        <h1 class="encabezado-titulo">
            Libros
        </h1>

        <a
            href="index.html"
            class="volver"
        >
            Volver al inicio
        </a>

    </div>

</header>


<!-- =========================================================
     CONTENIDO
========================================================== -->

<main class="contenedor">


    <!-- =====================================================
         ESTADÍSTICAS
    ====================================================== -->

    <section class="estadisticas">

        <div class="tarjeta-estadistica">

            <div class="estadistica-icono">
                📚
            </div>

            <div>

                <div
                    class="estadistica-numero"
                    id="totalLibros"
                >
                    0
                </div>

                <div class="estadistica-texto">
                    Total de libros
                </div>

            </div>

        </div>


        <div class="tarjeta-estadistica">

            <div class="estadistica-icono">
                ✅
            </div>

            <div>

                <div
                    class="estadistica-numero"
                    id="totalDisponibles"
                >
                    0
                </div>

                <div class="estadistica-texto">
                    Disponibles
                </div>

            </div>

        </div>


        <div class="tarjeta-estadistica">

            <div class="estadistica-icono">
                📖
            </div>

            <div>

                <div
                    class="estadistica-numero"
                    id="totalPrestados"
                >
                    0
                </div>

                <div class="estadistica-texto">
                    Prestados
                </div>

            </div>

        </div>


        <div class="tarjeta-estadistica">

            <div class="estadistica-icono">
                📦
            </div>

            <div>

                <div
                    class="estadistica-numero"
                    id="totalBaja"
                >
                    0
                </div>

                <div class="estadistica-texto">
                    Dados de baja
                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         REGISTRAR LIBRO
    ====================================================== -->

    <section class="seccion">

        <h3 class="seccion-titulo">
            Registrar libro
        </h3>


        <div class="formulario-libro">


            <div class="campo campo-codigo">

                <label for="codigoLibro">
                    Código del libro
                </label>

                <input
                    type="text"
                    id="codigoLibro"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="Ej. 167162"
                    autocomplete="off"
                >

            </div>


            <div class="campo campo-nombre">

                <label for="nombreLibro">
                    Nombre del libro
                </label>

                <input
                    type="text"
                    id="nombreLibro"
                    placeholder="Nombre del libro"
                    autocomplete="off"
                >

            </div>


            <div class="campo campo-completo">

                <label for="autorLibro">
                    Autor
                </label>

                <input
                    type="text"
                    id="autorLibro"
                    placeholder="Autor del libro"
                    autocomplete="off"
                >

            </div>


            <div class="campo campo-completo">

                <label for="generoLibro">
                    Género
                </label>

                <input
                    type="text"
                    id="generoLibro"
                    placeholder="Ej. Literatura infantil"
                    autocomplete="off"
                >

            </div>


            <div class="campo campo-completo">

                <label for="editorialLibro">
                    Editorial
                </label>

                <input
                    type="text"
                    id="editorialLibro"
                    placeholder="Editorial"
                    autocomplete="off"
                >

            </div>


            <div class="campo campo-completo">

                <label for="anioLibro">
                    Año
                </label>

                <input
                    type="text"
                    id="anioLibro"
                    inputmode="numeric"
                    maxlength="4"
                    placeholder="Ej. 2024"
                    autocomplete="off"
                >

            </div>


            <div class="campo campo-biblioteca">

                <label for="bibliotecaLibro">
                    Biblioteca
                </label>

                <select id="bibliotecaLibro">

                    <option value="">
                        Seleccione...
                    </option>

                    <option value="F">
                        F
                    </option>

                    <option value="M">
                        M
                    </option>

                    <option value="N">
                        N
                    </option>

                    <option value="R">
                        R
                    </option>

                    <option value="Z">
                        Z
                    </option>

                    <option value="NE">
                        NE
                    </option>

                </select>

            </div>


            <div class="acciones-formulario">

                <button
                    type="button"
                    class="btn-principal"
                    id="btnRegistrar"
                >
                    + Registrar libro
                </button>

            </div>


        </div>


        <div
            id="mensajeRegistro"
            class="mensaje"
        ></div>

    </section>


    <!-- =====================================================
         BUSCAR LIBROS
    ====================================================== -->

    <section class="seccion">

        <h3 class="seccion-titulo">
            Buscar libros
        </h3>


        <div class="busqueda">


            <div class="campo">

                <label for="busqueda">
                    Código, nombre, autor, género o editorial
                </label>

                <input
                    type="text"
                    id="busqueda"
                    placeholder="Escribe un código, nombre, autor..."
                    autocomplete="off"
                >

            </div>


            <div class="campo">

                <label for="filtroAutor">
                    Autor
                </label>

                <select id="filtroAutor">

                    <option value="Todos">
                        Todos
                    </option>

                </select>
