<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Módulo de Libros - Sistema Bibliotecario</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --primary-dark: #1e293b;
      --secondary: #0f172a;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Base */
    .sidebar {
      width: 260px;
      background-color: var(--secondary);
      color: #fff;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2rem;
      padding: 0 0.5rem;
    }

    .brand i {
      color: var(--primary-light);
      font-size: 1.5rem;
    }

    .menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .menu-item a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      color: #94a3b8;
      text-decoration: none;
      border-radius: var(--radius);
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .menu-item a:hover,
    .menu-item.active a {
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .menu-item.active a {
      background-color: var(--primary-light);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header {
      background-color: var(--surface);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-title h1 {
      font-size: 1.75rem;
      color: var(--primary-dark);
      font-weight: 700;
      text-align: center;
    }

    .content {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Cards */
    .card {
      background-color: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Grid Layouts */
    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-control {
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary-light);
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    /* Buttons */
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-light);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #2563eb;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .btn-danger {
      background-color: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding-left: 2.2rem;
    }

    .search-box i {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Table */
    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    .actions-cell {
      display: flex;
      gap: 0.5rem;
    }

    .btn-icon {
      padding: 0.4rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <i class="fa-solid fa-book-open"></i>
        <span>BiblioSys</span>
      </div>
      <ul class="menu">
        <li class="menu-item"><a href="#"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li class="menu-item active"><a href="#"><i class="fa-solid fa-book"></i> Libros</a></li>
        <li class="menu-item"><a href="#"><i class="fa-solid fa-users"></i> Usuarios</a></li>
        <li class="menu-item"><a href="#"><i class="fa-solid fa-handshake"></i> Préstamos</a></li>
      </ul>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-title">
        <h1>Libros</h1>
      </div>
    </header>

    <div class="content">
      <!-- Formulario Libros -->
      <section class="card">
        <h2 class="card-title"><i class="fa-solid fa-plus-circle"></i> Regitro de Libros</h2>
        <form class="grid-form" id="bookForm">
          <div class="form-group">
            <label for="title">Título</label>
            <input type="text" id="title" class="form-control" placeholder="Ej. Cien años de soledad" required />
          </div>
          <div class="form-group">
            <label for="author">Autor</label>
            <input type="text" id="author" class="form-control" placeholder="Ej. Gabriel García Márquez" required />
          </div>
          <div class="form-group">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" class="form-control" placeholder="Ej. 978-0307474728" required />
          </div>
          <div class="form-group">
            <label for="category">Categoría</label>
            <select id="category" class="form-control" required>
              <option value="">Seleccionar...</option>
              <option value="Novela">Novela</option>
              <option value="Ciencia">Ciencia</option>
              <option value="Historia">Historia</option>
              <option value="Tecnología">Tecnología</option>
            </select>
          </div>
          <div class="form-group">
            <label for="stock">Cantidad</label>
            <input type="number" id="stock" class="form-control" min="1" value="1" required />
          </div>
          
          <div class="form-actions">
            <button type="reset" class="btn btn-secondary">Limpiar</button>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Guardar Libro</button>
          </div>
        </form>
      </section>

      <!-- Tabla y Búsqueda -->
      <section class="card">
        <div class="controls-bar" style="margin-bottom: 1.5rem;">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="form-control" id="searchInput" placeholder="Buscar por título, autor o ISBN..." />
          </div>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Autor</th>
                <th>ISBN</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="booksTableBody">
              <!-- Datos de ejemplo -->
              <tr>
                <td>1</td>
                <td>Don Quijote de la Mancha</td>
                <td>Miguel de Cervantes</td>
                <td>978-8424115463</td>
                <td>Novela</td>
                <td>5</td>
                <td class="actions-cell">
                  <button class="btn btn-secondary btn-icon"><i class="fa-solid fa-pen"></i></button>
                  <button class="btn btn-danger btn-icon"><i class="fa-solid fa-trash"></i></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

</body>
</html>
